[project]
name = "testforge"
version = "0.1.0"
description = "Integration testing for SkyWatch and AgentForge"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "pytest==9.2.0", "jsonschema==4.26.0", "websockets==15.0.1", "pytest-playwright==0.10.0", "playwright==1.65.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["api: API contract tests", "integration: integration scenarios", "ws: WebSocket tests", "ui: browser tests"]
