[project]
name = "testforge"
version = "0.1.0"
description = "Integration testing for SkyWatch and AgentForge"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27,<1", "pytest>=8,<10", "jsonschema>=4,<5", "websockets>=12,<16", "pytest-playwright>=0.7,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["api: API contract tests", "integration: integration scenarios", "ws: WebSocket tests", "ui: browser tests"]
