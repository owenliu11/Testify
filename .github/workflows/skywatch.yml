name: SkyWatch integration
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: testforge
      - uses: actions/checkout@v4
        with:
          repository: owenliu11/skywatch
          ref: e83e675a66fa7cf8e00a1b28397be1f08a662832
          path: skywatch
          token: ${{ secrets.SKYWATCH_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: testforge
        run: python -m pip install .
      - name: Install Chromium and system dependencies
        working-directory: testforge
        run: python -m playwright install --with-deps chromium
      - name: Start target
        working-directory: testforge
        env:
          SKYWATCH_DIR: ${{ github.workspace }}/skywatch
        run: docker compose -p tf_skywatch -f targets/skywatch/compose.yaml up --build -d --wait
      - name: Run integration test
        working-directory: testforge
        run: python -m pytest tests/core tests/skywatch/api tests/skywatch/integration/test_ingestion.py -v --junitxml=reports/skywatch/junit.xml
      - name: Collect logs
        if: always()
        working-directory: testforge
        run: |
          mkdir -p reports/skywatch
          docker compose -p tf_skywatch -f targets/skywatch/compose.yaml logs --no-color > reports/skywatch/compose.log || true
      - name: Tear down starter stack
        if: always()
        working-directory: testforge
        run: docker compose -p tf_skywatch -f targets/skywatch/compose.yaml down -v
      - name: Run isolated integration, WebSocket, and browser scenarios
        working-directory: testforge
        env:
          SKYWATCH_DIR: ${{ github.workspace }}/skywatch
          TESTFORGE_PYTHON: python
        run: bash scripts/run-skywatch-isolated.sh
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skywatch-evidence
          path: testforge/reports/skywatch/
