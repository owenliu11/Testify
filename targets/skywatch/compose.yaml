services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: skywatch
      POSTGRES_PASSWORD: skywatch
      POSTGRES_DB: skywatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skywatch -d skywatch"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  provider-fixture:
    image: python:3.12-slim
    command: ["python", "-u", "/fixture/server.py"]
    volumes:
      - ../../fixtures/skywatch:/fixture:ro
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/requests')"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ${SKYWATCH_DIR:-../../../skywatch}/backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://skywatch:skywatch@db:5432/skywatch
      REDIS_URL: redis://redis:6379/0
      DAILY_CREDIT_BUDGET: "4000"
      POLL_REGIONS: bay_area
      OPENSKY_CLIENT_ID: dummy
      OPENSKY_CLIENT_SECRET: dummy
      OPENSKY_TOKEN_URL: http://provider-fixture:8080/token
      OPENSKY_STATES_URL: http://provider-fixture:8080/states/all
      SKYWATCH_TEST_MODE: "true"
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      provider-fixture:
        condition: service_healthy
