services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: skywatch
      POSTGRES_PASSWORD: skywatch
      POSTGRES_DB: skywatch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U skywatch -d skywatch"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  provider-fixture:
    image: python:3.12-slim
    stop_grace_period: 1s
    command: ["python", "-u", "/fixture/server.py"]
    environment:
      FIXTURE_SCENARIO: ${FIXTURE_SCENARIO:-normal}
    volumes:
      - ../../fixtures/skywatch:/fixture:ro
    ports:
      - "127.0.0.1:${TF_SKYWATCH_FIXTURE_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/requests')"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ${SKYWATCH_DIR:-../../../skywatch}/backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request as u; assert json.load(u.urlopen('http://127.0.0.1:8000/health', timeout=2))['status'] == 'ok'"]
      interval: 2s
      timeout: 3s
      retries: 30
    environment:
      DATABASE_URL: postgresql://skywatch:skywatch@db:5432/skywatch
      REDIS_URL: redis://redis:6379/0
      DAILY_CREDIT_BUDGET: "4000"
      POLL_REGIONS: bay_area
      OPENSKY_CLIENT_ID: dummy
      OPENSKY_CLIENT_SECRET: dummy
      OPENSKY_TOKEN_URL: http://provider-fixture:8080/token
      OPENSKY_STATES_URL: http://provider-fixture:8080/states/all
      SKYWATCH_TEST_MODE: ${SKYWATCH_TEST_MODE:-true}
      WS_ALLOWED_ORIGINS: http://127.0.0.1:${TF_SKYWATCH_UI_PORT:-15173}
    ports:
      - "127.0.0.1:${TF_SKYWATCH_API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      provider-fixture:
        condition: service_healthy

  frontend:
    profiles: ["ui"]
    build:
      context: ${SKYWATCH_DIR:-../../../skywatch}/frontend
      args:
        API_PORT: ${TF_SKYWATCH_API_PORT:-18000}
      dockerfile_inline: |
        FROM node:22-alpine
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN node -e 'const fs=require("fs"); const p="vite.config.ts"; const s=fs.readFileSync(p,"utf8"); const marker="  server: {"; if(!s.includes(marker)) throw Error("Vite config changed"); fs.writeFileSync(p,s.replace(marker,"  preview: { host: true, proxy: { \"/aircraft\": apiTarget, \"/anomalies\": apiTarget } },\n"+marker));'
        ARG API_PORT
        ENV VITE_WS_URL=ws://127.0.0.1:$${API_PORT}/ws/live
        RUN npm run build
        ENV API_PROXY_TARGET=http://api:8000
        CMD ["npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "127.0.0.1:${TF_SKYWATCH_UI_PORT:-15173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
